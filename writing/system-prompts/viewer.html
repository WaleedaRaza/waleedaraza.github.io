<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Prompts | Waleed A. Raza</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --orange: #ff6b35;
      --teal: #00c8a0;
      --text-dim: #8a8a94;
      --border: rgba(255,255,255,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn, .download-btn {
      flex-shrink: 0;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-btn { background: var(--orange); color: #000; }
    .back-btn:hover { background: #ff8c5a; }

    .download-btn { border: 1px solid var(--teal); color: var(--teal); }
    .download-btn:hover { background: var(--teal); color: #000; }

    /* The toggle between the five documents */
    .toggle {
      display: flex;
      flex: 1;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .toggle::-webkit-scrollbar { display: none; }

    .toggle button {
      flex-shrink: 0;
      padding: 8px 14px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle button:hover { border-color: var(--orange); color: var(--orange); }
    .toggle button.active { border-color: var(--teal); color: var(--teal); }

    .pdf {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    @media (max-width: 640px) {
      .bar { gap: 8px; padding: 10px 12px; }
      .back-btn, .download-btn { padding: 8px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a href="../../index.html#media" class="back-btn">← Back</a>
    <nav class="toggle" id="toggle" aria-label="System prompts"></nav>
    <a href="#" class="download-btn" id="download">↓ PDF</a>
  </header>

  <iframe class="pdf" id="pdf" title="System prompt PDF"></iframe>

  <script>
    const DOCS = [
      { id: '01', label: '01 Philosophical OS', file: '01-Philosophical-Operating-System.pdf' },
      { id: '02', label: '02 Learning Protocol', file: '02-Learning-Protocol.pdf' },
      { id: '03', label: '03 Vision Planning', file: '03-Vision-Based-Planning.pdf' },
      { id: '04', label: '04 Flowchart Mind', file: '04-Flowchart-Mind.pdf' },
      { id: '05', label: '05 90/10 Doctrine', file: '05-Ninety-Ten-Doctrine.pdf' }
    ];

    const toggle = document.getElementById('toggle');
    toggle.innerHTML = DOCS.map(d => `<button data-doc="${d.id}">${d.label}</button>`).join('');

    function show(id) {
      const doc = DOCS.find(d => d.id === id) || DOCS[0];
      document.getElementById('pdf').src = doc.file;
      document.getElementById('download').href = doc.file;
      document.title = `${doc.label.slice(3)} | Waleed A. Raza`;
      toggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.doc === doc.id));
      history.replaceState(null, '', `?doc=${doc.id}`);
    }

    toggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) show(btn.dataset.doc);
    });

    show(new URLSearchParams(location.search).get('doc'));
  </script>
</body>
</html>
