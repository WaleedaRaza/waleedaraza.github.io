<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blawg</title>
<meta name="description" content="Waleed Raza's blawg: essays on a hex board.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one screen, one dark look (the portfolio's). A honeycomb board with a big hexagonal stage at its centre, and a resizable reading sidebar. */
:root {
  color-scheme: dark;
  --void: #000000; --surface: #07070c; --card: #0b0b13; --lift: #12121c; --line: #1e1e2b; --line2: #2c2c3d;
  --ink: #ececf2; --ink2: #a0a0b4; --ink3: #62627a;
  --orange: #ff6b35; --teal: #00d4aa; --green: #39ff14; --fuchsia: #ff00ff; --orange-soft: rgba(255,107,53,.12);
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace; --display: 'Space Grotesk', system-ui, sans-serif; --read: 'Crimson Pro', Georgia, serif;
  --sw: 400px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--mono); font-size: 13px; line-height: 1.5; overflow: hidden; display: flex; flex-direction: column; }
/* the same two grain layers as the portfolio's home page */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 49; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E"); background-size: 200px 200px; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .08; background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='base'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23base)'/%3E%3C/svg%3E"); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--orange); outline-offset: 2px; }

#bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
#bar .name { font-weight: 600; letter-spacing: .22em; font-size: 14px; }
#tabs { display: flex; border: 1px solid var(--line2); }
#tabs button { padding: 5px 14px; color: var(--ink2); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
#tabs button[aria-pressed="true"] { background: var(--ink); color: var(--void); }
#q { flex: 1 1 150px; min-width: 0; max-width: 300px; padding: 6px 10px; border: 1px solid var(--line2); background: var(--void); color: var(--ink); font: inherit; }
#mock { margin-left: auto; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--orange); border: 1px solid var(--orange); padding: 3px 8px; }

#main { flex: 1; min-height: 0; display: flex; position: relative; }
#boardwrap { flex: 1; min-width: 0; position: relative; }
#board { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#board.drag { cursor: grabbing; }
#svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.cell, .bgc { fill: #0d0d14; stroke: #000; stroke-width: 5; }
#tip { position: absolute; z-index: 6; pointer-events: none; max-width: 320px; background: var(--surface); border: 1px solid var(--line2); padding: 6px 10px; font-family: var(--display); font-weight: 600; font-size: 13px; line-height: 1.3; color: var(--ink); }
.t { cursor: pointer; }
.t .hx { fill: var(--gf, #171722); stroke: var(--gs, var(--line2)); stroke-width: 1.2; transition: stroke .15s, fill .15s; }
.t.written .hx { stroke: var(--ink2); }
.t text { font-family: var(--display); font-weight: 500; fill: #d6d6e2; text-anchor: middle; pointer-events: none; }
.t.written text { fill: var(--ink); }
.t .shade { fill: rgba(0,0,0,.74); }
.t.pic text { fill: var(--ink); }
.t .artdot { fill: var(--orange); }
.t:hover .hx { stroke: var(--ink); }
.t.linked .hx { stroke: #5a6078; }
.t.end .hx { stroke: var(--endc, var(--teal)); stroke-width: 5; }
.t.end text { fill: var(--ink); }
.t.sel .hx { stroke: var(--orange); stroke-width: 5; }
.t.hitq .hx { stroke: var(--teal); stroke-width: 2; }
#svg.focus .t:not(.sel):not(.ingroup):not(.end) { opacity: .45; }
#svg.far .gh text.in { display: none; }
#svg.far .t .hx { stroke-width: 3; }
#svg.far .ln.amb { stroke-width: 7; }
#svg.far .ln.lit { stroke-width: 22; }
#svg.far .ln.home { stroke-width: 12; stroke-dasharray: 12 30; }
#svg.far .t.end .hx { stroke-width: 14; fill: var(--endc); }
#svg.far.focus .t:not(.sel):not(.ingroup):not(.end) { opacity: .5; }
#svg.far .t.sel .hx { fill: var(--orange); }
.gh { cursor: pointer; }
.gh .hx { fill: var(--gf); stroke: var(--gs); stroke-width: 2.5; }
.t.hov .hx { stroke: #fff; stroke-width: 7; fill: #3a3a4c; }
.hovmark { pointer-events: none; animation: hovp 1s ease-in-out infinite alternate; }
@keyframes hovp { from { opacity: 1; } to { opacity: .45; } }
.t.hov { filter: drop-shadow(0 0 18px rgba(255,255,255,.35)); }
.gh text { font-family: var(--display); font-weight: 600; fill: var(--ink); text-anchor: middle; pointer-events: none; }
.gh text.cnt { font-family: var(--mono); font-weight: 400; fill: var(--orange); letter-spacing: .1em; }
.gh .farlab text { font-size: 15px; paint-order: stroke; stroke: var(--void); stroke-width: 5px; stroke-linejoin: round; }
.gh.on .hx { stroke: #fff; }
#svg:not(.far) .gh .farlab { display: none; }
.stage { fill: #030306; stroke: var(--orange); stroke-width: 1.5; cursor: pointer; }
.stagelab text { font-family: var(--display); font-weight: 600; fill: var(--ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: var(--void); stroke-width: 7px; stroke-linejoin: round; }
.stagelab text.pl { font-family: var(--mono); letter-spacing: .3em; }
.stagelab { display: none; }
.ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.ln.amb { stroke: #6a7088; stroke-width: 2.4; opacity: .4; }
.cv { fill: none; stroke-linecap: round; }
.cv.amb { stroke: #6a7088; stroke-width: 2.4; opacity: .38; transition: opacity .5s; }
.cvg:hover .cv.amb { opacity: 1; stroke: var(--ink); }
.cvg .lndot.amb { transition: opacity .5s; }
.cv.lit { stroke-width: 7; }
#svg.solo #lay-direct .amb { opacity: 0; }
#svg.solo #lay-direct { pointer-events: none; }
#zoom button[aria-pressed="true"] { color: var(--orange); background: var(--orange-soft); }
.fw.dim { fill: var(--ink3); letter-spacing: .2em; }
.br:hover .ln.amb, .br:focus .ln.amb { stroke: var(--ink); opacity: 1; }
.lndot.amb { fill: #4a5066; opacity: .6; }
.ln.lit { stroke-width: 7; opacity: 1; }
.ln.home { stroke: var(--orange); stroke-width: 4; stroke-dasharray: 4 14; opacity: .9; }
.lnhit { fill: none; stroke: transparent; stroke-width: 34; cursor: pointer; }
.lndot { stroke: none; }
.note { cursor: pointer; }
.note rect { fill: var(--void); stroke-width: 1; }
.note text { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.note text.w { font-family: var(--read); font-style: italic; font-size: 14px; fill: var(--ink2); }
.exp .hx { fill: #08080e; stroke: var(--orange); stroke-width: 2; }
.exp text { text-anchor: middle; pointer-events: none; }
.exp .k { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; fill: var(--orange); }
.exp .ti { font-family: var(--display); font-weight: 600; fill: var(--ink); }
.exp .de { font-family: var(--read); fill: var(--ink2); }
.exp { cursor: pointer; }

#ov { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; pointer-events: none; }
#artbox { position: absolute; overflow: hidden; opacity: 0; transition: opacity .7s; }
#artbox.on { opacity: 1; }
#artin { position: absolute; left: 0; top: 0; }
#artin pre, #artin canvas { margin: 0; display: block; }
#textbox { position: absolute; overflow-y: auto; pointer-events: auto; font-size: 60px; padding: .93em 1.5em 1.33em; text-align: left; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; opacity: 0; transform: translateY(30px); transition: opacity .55s, transform .55s cubic-bezier(.2,.7,.2,1); }
#textbox.on { opacity: 1; transform: none; }
#textbox.more { -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
#textbox .k { font-size: .5em; letter-spacing: .18em; text-transform: uppercase; color: var(--orange); margin-bottom: .8em; }
#textbox h2 { font-family: var(--display); font-weight: 700; font-size: 2.2em; line-height: 1.02; letter-spacing: -.02em; margin: 0 0 .3em; text-wrap: balance; max-width: 14.4em; }
#textbox h2.long { font-size: 1.6em; max-width: 19.8em; }
#textbox p { margin: 0 0 .6em; font-family: var(--read); font-size: 1em; line-height: 1.42; color: var(--ink); max-width: 29.2em; }
#textbox p.lead { color: var(--ink2); font-size: 1.17em; line-height: 1.3; max-width: 25em; }
#textbox p.slot { font-family: var(--mono); font-size: .53em; line-height: 1.55; color: var(--ink3); border: 3px dashed var(--line2); padding: .8em 1em; max-width: none; }
#textbox p.fill { color: #4a4a5c; }
#textbox .dir { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.17em; }
#textbox .dir button { display: flex; gap: .52em; align-items: baseline; text-align: left; padding: .48em 0; border-bottom: 3px solid var(--line); font-family: var(--display); font-weight: 600; font-size: .77em; line-height: 1.2; }
#textbox .dir button:hover { color: var(--orange); }
#textbox .dir .no { font-family: var(--mono); font-weight: 400; font-size: .61em; color: var(--ink3); }
@media (max-width: 820px) { #textbox .dir { grid-template-columns: 1fr; } }
.fam { fill: none; stroke-width: 3; opacity: .7; stroke-linecap: round; }
.fam.on { opacity: 1; stroke-width: 5; }
#svg.far .fam { stroke-width: 9; opacity: .8; }
.fc { stroke-width: 2; transform: scale(.9); transition: transform .55s cubic-bezier(.2,.7,.2,1), fill .55s, stroke .55s; }
.fc.off { fill: #0d0d14; stroke: #000; stroke-width: 5; transform: scale(1); }
.fc.tv { fill: #000; stroke: #1d1d29; transform: scale(1); }
.fc.chip { fill: #0d0d16; stroke: var(--ink3); }
.fc.btn { fill: #0d0d16; stroke: var(--orange); stroke-width: 3; cursor: pointer; }
.fc.btn:hover { fill: rgba(255,107,53,.22); }
.fc.txt { fill: #09090f; stroke: #09090f; transform: scale(1); }
.fw { font-family: var(--mono); font-weight: 500; fill: var(--ink); text-anchor: middle; letter-spacing: .04em; pointer-events: none; animation: fwin .5s both; }
@keyframes fwin { from { opacity: 0; } }
.blk { fill: none; stroke: var(--orange); stroke-width: 4; opacity: .9; stroke-linecap: round; }
.tvo { fill: none; stroke: #4a4a62; stroke-width: 3; stroke-linecap: round; }
#side { width: var(--sw); flex: none; border-left: 1px solid var(--line2); background: var(--surface); display: flex; flex-direction: column; position: relative; min-width: 0; z-index: 4; }
#grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 5; touch-action: none; }
#grip::after { content: ""; position: absolute; left: 4px; top: 50%; width: 3px; height: 44px; margin-top: -22px; background: var(--line2); }
#grip:hover::after, #grip.on::after { background: var(--orange); }
#shead { display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 22px; border-bottom: 1px solid var(--line); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
#crumb { flex: 1; min-width: 0; }
#crumb button { color: var(--ink2); letter-spacing: .12em; text-transform: uppercase; }
#crumb button:hover { color: var(--orange); }
#shead .ic { border: 1px solid var(--line2); width: 26px; height: 24px; color: var(--ink2); font-size: 13px; flex: none; }
#shead .ic:hover { border-color: var(--orange); color: var(--orange); }
#sbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px calc(40px + env(safe-area-inset-bottom, 0px)) 22px; padding-right: max(26px, env(safe-area-inset-right, 0px)); }
#main.wide #boardwrap { display: none; }
#main.wide #side { width: 100%; border-left: 0; }
#main.wide #grip { display: none; }
/* ── round 8: one board, two colours, five ways to navigate ── */
.cell, .bgc, .fc.off { stroke-width: var(--sk, 5); }
.t .hx { fill: #1c1c2a; stroke: #4a4a64; }
.gh .hx { fill: #26263c; stroke: #8a8aa6; stroke-width: 3; }
.fam { stroke: #5c5c78; }
.fam.on { stroke: var(--orange); }
.t.end .hx { stroke: var(--teal); }
.t.msel .hx { stroke: var(--orange); stroke-width: 5; fill: #2a1a14; }
.t.sel .hx { fill: #2e1a10; }
#svg.far .t.sel .hx, #svg.far .t.msel .hx { fill: var(--orange); }
#svg.far .t.end .hx { fill: var(--teal); }
.cv.amb { stroke: #8a8fa6; stroke-width: 2.2; opacity: .32; }
.cvg .lndot.amb { fill: #8a8fa6; opacity: .45; }
.cvg.hot .cv.amb { opacity: 1; stroke: var(--ink); stroke-width: 4; }
#svg.solo #lay-direct .cvg:not(.hot) { opacity: .06; }
#svg.nolines #lay-direct { display: none; }
.cv.lit { stroke: var(--orange); stroke-width: 6; fill: none; stroke-linecap: round; }
.cv.lit.via { stroke-width: 11; }
.lndot.t1 { fill: var(--teal); } .lndot.o1 { fill: var(--orange); }
.fc.btn.arr { stroke: var(--ink3); stroke-width: 2; }
.fc.btn.arr:hover { stroke: var(--orange); }
.fc.btn.ess { stroke: var(--orange); fill: #1c0f08; }
.fc.btn.ess:hover { fill: rgba(255,107,53,.35); }
#textbox { transform: none; transition: opacity .22s; }
#textbox.on { transform: none; }
#textbox .ends { display: grid; grid-template-columns: 1fr auto 1fr; gap: .4em; align-items: stretch; margin: .3em 0 .7em; }
#textbox .ends button { text-align: left; border: 3px solid var(--teal); padding: .4em .55em; font-family: var(--display); font-weight: 600; font-size: .78em; line-height: 1.15; color: var(--ink); }
#textbox .ends button:hover { background: rgba(0,212,170,.12); }
#textbox .ends button small { display: block; font-family: var(--mono); font-weight: 400; font-size: .5em; letter-spacing: .14em; color: var(--teal); margin-bottom: .3em; }
#textbox .ends .sw { align-self: center; font-size: 1em; color: var(--orange); border: 3px solid var(--orange); width: 1.6em; height: 1.6em; display: grid; place-items: center; }
#textbox .sec { font-family: var(--mono); font-size: .45em; letter-spacing: .18em; text-transform: uppercase; color: var(--ink3); margin: 1.2em 0 .4em; border-top: 3px solid var(--line); padding-top: .8em; }
#textbox .cl button { display: block; width: 100%; text-align: left; padding: .35em 0 .35em .5em; border-left: 4px solid var(--teal); margin-bottom: .3em; font-family: var(--display); font-weight: 600; font-size: .7em; }
#textbox .cl button:hover, #textbox .cl button.hl { color: var(--orange); background: rgba(255,107,53,.08); }
#textbox .cards { display: grid; gap: .35em; }
#textbox .cards button { text-align: left; border: 3px solid var(--orange); padding: .45em .55em; min-height: 3.2em; }
#textbox .cards b { display: block; font-family: var(--display); font-weight: 600; font-size: .7em; line-height: 1.15; }
#textbox .cards span { display: block; font-family: var(--read); font-size: .55em; color: var(--ink2); margin-top: .2em; }
#textbox .cards.t b { font-size: .55em; } #textbox .cards.t span { display: none; }

#navsw { display: flex; align-items: center; gap: 0; border: 1px solid var(--line2); }
#navsw span { padding: 4px 8px; font-size: 9.5px; letter-spacing: .14em; color: var(--ink3); text-transform: uppercase; border-right: 1px solid var(--line2); }
#navsw button { padding: 4px 9px; font-size: 11px; color: var(--ink2); }
#navsw button[aria-pressed="true"] { background: var(--orange); color: #000; }
#samp { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink3); }
#samp input { accent-color: var(--orange); }
#toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--orange); padding: 8px 14px; font-size: 12px; z-index: 60; max-width: 90vw; word-break: break-all; }

/* shared parts used by every navigation design */
.ui { font-family: var(--mono); font-size: 12px; color: var(--ink2); }
.ctlrow { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ctlrow .ib { width: 30px; height: 28px; border: 1px solid var(--line2); color: var(--ink2); font-size: 14px; display: grid; place-items: center; background: var(--void); }
.ctlrow .ib:hover { border-color: var(--orange); color: var(--ink); }
.ctlrow .lt { margin-left: auto; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border: 1px solid var(--line2); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.ctlrow .lt i { width: 22px; height: 12px; border-radius: 6px; background: var(--line2); position: relative; }
.ctlrow .lt i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); transition: left .15s; }
.ctlrow .lt[aria-pressed="true"] i { background: rgba(255,107,53,.35); }
.ctlrow .lt[aria-pressed="true"] i::after { left: 12px; background: var(--orange); }
.lab { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink3); }
.row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 3px 8px; text-align: left; border-left: 2px solid transparent; }
.row .ti { flex: 1; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 13.5px; line-height: 1.25; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .ty { flex: none; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.row .dot { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); opacity: .8; }
.row .lk { flex: none; font-size: 10px; color: var(--teal); }
.row:hover { background: var(--card); } .row:hover .ti { color: var(--orange); }
.row.sel { background: rgba(255,107,53,.12); border-left-color: var(--orange); }
.row.sel .ti { color: var(--orange); white-space: normal; }
.row.end { border-left-color: var(--teal); }
.cr { display: block; width: 100%; text-align: left; padding: 7px 8px 7px 10px; border-left: 2px solid var(--teal); margin-bottom: 4px; background: rgba(0,212,170,.04); }
.cr .to { display: flex; gap: 8px; align-items: baseline; }
.cr .to b { flex: 1; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 13.5px; color: var(--ink); line-height: 1.25; }
.cr .to em { font-style: normal; font-size: 10px; color: var(--teal); letter-spacing: .06em; white-space: nowrap; }
.cr .wd { display: block; font-family: var(--read); font-size: 14.5px; font-style: italic; color: var(--ink3); margin-top: 2px; line-height: 1.3; }
.cr .sm { font-size: 9px; letter-spacing: .12em; color: var(--ink3); text-transform: uppercase; margin-left: 6px; }
.cr:hover, .cr.hl { background: rgba(255,107,53,.1); border-left-color: var(--orange); }
.cr:hover .to b, .cr.hl .to b { color: var(--orange); }
.fcard { padding: 12px 14px; border-bottom: 1px solid var(--line); background: #0a0a12; }
.fcard .top { display: flex; align-items: flex-start; gap: 8px; }
.fcard h4 { flex: 1; margin: 3px 0 0; font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.2; color: var(--orange); }
.fcard .x { flex: none; width: 24px; height: 24px; border: 1px solid var(--line2); color: var(--ink3); }
.fcard .x:hover { color: var(--orange); border-color: var(--orange); }
.fcard p { margin: 6px 0 10px; font-family: var(--read); font-size: 15px; line-height: 1.35; color: var(--ink2); }
.fcard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; }
.fcard .acts button { border: 1px solid var(--line2); padding: 4px 8px; font-size: 10.5px; color: var(--ink2); }
.fcard .acts button:hover { border-color: var(--orange); color: var(--ink); }
.fcard .acts button.pri { border-color: var(--teal); color: var(--teal); }
.fcard .slotw { border: 1px dashed var(--line2); padding: 8px 10px; font-size: 11px; color: var(--ink3); margin: 6px 0 10px; }
.keyb { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 10.5px; color: var(--ink3); }
.keyb span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.keyb svg { width: 13px; height: 13px; }
